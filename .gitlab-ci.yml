stages:
  - build
  - qa
  - serve
  - cleanup

.docker-job:
  rules:
    - if : $CI_COMMIT_BRANCH == "dev"
      variables:
        TAG = dev-${CI_COMMIT_SHORT_SHA}
    - if : $CI_COMMIT_BRANCH == "int"
      variables:
        TAG = snapshot-${CI_COMMIT_SHORT_SHA}
    - if : $CI_COMMIT_TAG
      variables:
        TAG = $CI_COMMIT_TAG

variables:
  DOCKER_IMAGE: ayerman/wattsy-bot

build:
  image: docker:27.2.0
  stage: build
  extends: .docker-job
  services:
    - docker:27.2.0-dind
  script:
    - docker build -t $DOCKER_IMAGE:$TAG .

linter:
  image: $DOCKER_IMAGE:latest
  stage: qa
  script:
    - pip install pylint
    - pylint src

tag-to-latest:
  image: docker:27.2.0
  stage: serve
  extends: .docker-job
  services:
    - docker:27.2.0-dind
  dependencies:
    - build
  script:
    - docker tag $DOCKER_IMAGE:$TAG $DOCKER_IMAGE:latest

cleanup:
  image: docker:27.2.0
  stage: cleanup
  extends: .docker-job
  services:
    - docker:27.2.0-dind
  dependencies:
    - build
  script:
    - docker rmi $DOCKER_IMAGE:$TAG || true
  when: on_failure
